<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회의 결정사항 추적표</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0f1e3d;--sub:#5f6b80;--line:#dfe4ec;--blue:#0054a6;--sky:#e6eef7;--or:#f36f21;--red:#d93a3a;--green:#1f9d6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif;font-size:14px}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center}
header h1{font-size:18px;margin:0}header small{display:block;color:#a9b8d0;font-size:12px;font-weight:400}
.tag{margin-left:auto;background:var(--or);font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 24px 36px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px #0001;margin-bottom:14px}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);font-weight:600}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
button{font:inherit;border:0;background:var(--blue);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button.gh{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:var(--card);border-radius:14px;padding:14px;min-height:240px}
.col h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.it{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fbfcfe}
.it.late{border-left-color:var(--red)}.it.done{opacity:.6;border-left-color:var(--green)}
.it b{display:block;margin-bottom:4px}.it small{color:var(--sub)}
.it .ac{margin-top:6px;display:flex;gap:6px}.it .ac button{padding:3px 8px;font-size:12px}
.rep{white-space:pre-wrap;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.7}
.note{font-size:12px;color:var(--sub)}
</style></head><body>
<header><div><h1>회의 결정사항 추적표</h1><small>회의에서 정한 일을 담당·기한별로 관리하고, 다음 회의용 점검 문안을 자동 작성</small></div><span class="tag">교육용 가상 자료</span></header>
<div class="wrap">
  <div class="card">
    <form id="f">
      <label style="flex:2">결정사항<input id="what" required placeholder="예: 우천 시 체육관 대관 확정"></label>
      <label>담당(부서·직위)<input id="who" required placeholder="예: 문화체육과 팀장"></label>
      <label>기한<input type="date" id="due" required></label>
      <button>추가</button>
    </form>
    <p class="note" style="margin:8px 0 0">※ 담당은 부서·직위로만 적습니다(개인 성명·연락처 입력 금지). 기준일 <input type="date" id="base" style="padding:3px 6px"></p>
  </div>
  <div class="board">
    <div class="col"><h3>할 일 <span id="c0"></span></h3><div id="l0"></div></div>
    <div class="col"><h3>진행 중 <span id="c1"></span></h3><div id="l1"></div></div>
    <div class="col"><h3>완료 <span id="c2"></span></h3><div id="l2"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><b>다음 회의 점검 문안</b><span><button class="gh" id="sample">가상 예시 불러오기</button> <button id="copy">복사</button></span></div><div class="rep" id="rep" style="margin-top:10px"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),KEY="tf-decisions-demo";
const p2=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=s=>{const d=parse(s);return `${d.getMonth()+1}. ${d.getDate()}.(${"일월화수목금토"[d.getDay()]})`};
let L=[];try{L=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}};
function render(){const base=$("base").value;
  [0,1,2].forEach(s=>{const items=L.filter(x=>x.s===s).sort((a,b)=>a.due.localeCompare(b.due));$("c"+s).textContent=items.length+"건";
    $("l"+s).innerHTML=items.map(x=>{const late=s<2&&x.due<base;return `<div class="it ${late?"late":""} ${s===2?"done":""}"><b>${x.what}</b><small>${x.who} · 기한 ${fmt(x.due)}${late?' · <span style="color:var(--red);font-weight:700">기한 경과</span>':""}</small><div class="ac">${s>0?`<button class="gh" data-m="${x.id}" data-d="-1">◀</button>`:""}${s<2?`<button class="gh" data-m="${x.id}" data-d="1">▶</button>`:""}<button class="gh" data-x="${x.id}">삭제</button></div></div>`}).join("")||'<p class="note">없음</p>'});
  const srt=a=>a.sort((p,q)=>p.due.localeCompare(q.due)),late=srt(L.filter(x=>x.s<2&&x.due<base)),open=srt(L.filter(x=>x.s<2&&x.due>=base)),done=L.filter(x=>x.s===2);
  $("rep").textContent=[`□ 결정사항 이행 점검 (${fmt(base)} 기준)`,`○ 전체 ${L.length}건: 완료 ${done.length}, 진행·예정 ${open.length}, 기한 경과 ${late.length}`,...(late.length?["○ 기한 경과",...late.map(x=>`  - ${x.what} (${x.who}, 기한 ${fmt(x.due)})`)]:[]),...(open.length?["○ 진행·예정",...open.map(x=>`  - ${x.what} (${x.who}, ${fmt(x.due)})`)]:[])].join("\n")}
$("f").onsubmit=e=>{e.preventDefault();L.push({id:Date.now(),what:$("what").value,who:$("who").value,due:$("due").value,s:0});save();$("what").value="";render()};
document.addEventListener("click",e=>{const m=e.target.closest("[data-m]"),x=e.target.closest("[data-x]");if(m){const it=L.find(i=>i.id==m.dataset.m);it.s=Math.max(0,Math.min(2,it.s+ +m.dataset.d));save();render()}if(x){L=L.filter(i=>i.id!=x.dataset.x);save();render()}});
$("sample").onclick=()=>{L=[["장소 우주천 둔치 확정, 이동식 화장실 예비비 집행","문화체육과",'2026-09-18',2],["지역축제 안전관리계획 초안 작성","안전총괄과 담당 주무관","2026-09-25",1],["현수막 지정게시대 신청","자치행정과 담당 주무관","2026-10-10",0],["경품 응모권 개인정보 수집·이용 동의란 추가","문화체육과 담당 주무관","2026-10-17",0],["AI 생성 포스터 이미지 이용 조건 확인","자치행정과 담당 주무관","2026-10-02",1],["우천 시 축소 운영·체육관 대관 확인","문화체육과 팀장","2026-09-30",0]].map((r,i)=>({id:Date.now()+i,what:r[0],who:r[1],due:r[2],s:r[3]}));save();render()};
$("copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($("rep").textContent);$("copy").textContent="복사됨";setTimeout(()=>$("copy").textContent="복사",1200)};
$("base").value="2026-10-01";$("base").onchange=render;$("due").value="2026-10-15";render();
</script></body></html>
