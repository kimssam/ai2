<meta name="theme-color" content="#131316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131316;--bg2:#1a1a1f;--panel:#1e1e24;--line:#2c2c35;--ink:#f3f3f7;--muted:#a3a3b5;--dim:#6f6f82;
  --mint:#3ee6c1;--violet:#9b7bff;--blue:#4f8cff;--sky:#38bdf8;
  --grad:linear-gradient(120deg,#9b7bff,#4f8cff);--grad2:linear-gradient(120deg,#22d3c5,#38bdf8);
  --code:#0d0d11;--latin:'Unbounded','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:24px;line-height:1.75;word-break:keep-all;
  background-image:radial-gradient(#ffffff12 1px,transparent 1.2px);background-size:26px 26px}
button{font:inherit;cursor:pointer}a{color:var(--mint)}
.u{background:linear-gradient(90deg,var(--mint),var(--violet)) 0 100%/100% 3px no-repeat;padding-bottom:2px;font-weight:700;color:#fff}

/* ---------- HERO ---------- */
.hero{position:relative;padding:70px max(4vw,20px) 60px;text-align:center;overflow:hidden;
  background:radial-gradient(900px 420px at 20% 0%,#5b3fd455,transparent 70%),radial-gradient(800px 420px at 85% 10%,#1f6fff40,transparent 70%),linear-gradient(180deg,#0e0e12,transparent 90%)}
.hero .kicker{font-family:var(--latin);font-size:16px;letter-spacing:.32em;color:var(--mint);font-weight:700}
.hero h1{margin:14px 0 8px;font-size:clamp(40px,5.4vw,76px);line-height:1.18;font-weight:900;letter-spacing:-.02em}
.hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:0 auto;color:var(--muted);font-size:24px}
.frame{position:relative;max-width:1100px;margin:44px auto 0;padding:3px;border-radius:22px;background:linear-gradient(120deg,var(--mint),var(--violet) 55%,var(--blue));box-shadow:0 0 0 1px #ffffff10,0 30px 80px #6d4dff40,0 0 60px #3ee6c125}
.frame img{display:block;width:100%;border-radius:19px;background:#080f29}
.stats{display:flex;justify-content:center;gap:56px;margin-top:40px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--latin);font-size:52px;line-height:1;font-weight:700}
.stat span{display:block;margin-top:8px;font-size:16px;letter-spacing:.2em;color:var(--mint);font-weight:700}

/* ---------- STICKY BAR ---------- */
.bar{position:sticky;top:0;z-index:30;background:#131316e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px max(4vw,20px)}
.bar-in{display:flex;gap:14px;align-items:center;max-width:1400px;margin:auto}
.menu-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:9px 18px;font-weight:700;font-size:19px;white-space:nowrap}
.menu-btn:hover{border-color:var(--violet)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 18px}
.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px #9b7bff30}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:19px;width:100%}
.search input::placeholder{color:var(--dim)}
.count{font-size:16px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:1400px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;font-family:var(--latin);font-size:14px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 14px;text-decoration:none;background:var(--panel)}
.chip:hover{color:#fff;border-color:var(--violet)}
.chip.new{color:var(--violet);border-color:#9b7bff66}

/* ---------- DRAWER TOC ---------- */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .dim{position:absolute;inset:0;background:#000a}
.drawer nav{position:absolute;left:0;top:0;bottom:0;width:min(440px,88vw);background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:28px 22px}
.drawer h2{font-family:var(--latin);font-size:16px;letter-spacing:.24em;color:var(--mint);margin:0 0 14px}
.toc-st{font-weight:900;font-size:21px;margin:22px 4px 6px}
.drawer a{display:flex;gap:12px;padding:9px 10px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:18px;line-height:1.45}
.drawer a:hover{background:#ffffff0d}
.drawer a i{font-style:normal;font-family:var(--latin);color:var(--mint);font-size:14px;min-width:28px;padding-top:3px}

/* ---------- GUIDE ---------- */
main{max-width:1400px;margin:0 auto;padding:60px max(4vw,20px) 120px}
.guide{max-width:1000px;margin:0 auto 40px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 40px}
.guide h2{margin:0 0 10px;font-size:28px}
.guide ul{margin:0;padding-left:26px;color:#d6d6e2}.guide li{margin:8px 0}.guide li::marker{color:var(--mint)}
.warn{margin-top:18px;border:1px solid #f5b94a55;background:#f5b94a12;color:#ffd890;border-radius:16px;padding:14px 20px;font-size:20px}

/* ---------- TIMELINE ---------- */
.tl{position:relative}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,var(--mint) 4%,var(--mint) 96%,transparent);opacity:.85}
.stage{position:relative;text-align:center;padding:90px 0 50px;scroll-margin-top:150px}
.stage .lab{font-family:var(--latin);font-size:15px;letter-spacing:.3em;color:var(--mint);font-weight:700}
.stage h2{margin:8px 0 4px;font-size:clamp(36px,4vw,54px);font-weight:900;display:inline-block;background:var(--bg);padding:0 22px;position:relative}
.stage p{margin:0 auto;color:var(--muted);font-size:20px;background:var(--bg);display:inline-block;padding:0 18px;position:relative}
.stage .chev{display:block;margin:14px auto 0;width:22px;height:22px;border-right:3px solid var(--mint);border-bottom:3px solid var(--mint);transform:rotate(45deg);background:var(--bg)}
.row{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0 120px;align-items:start;padding:46px 0;scroll-margin-top:150px}
.row:after{content:"";position:absolute;left:50%;top:70px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);background:var(--bg);border:3px solid var(--mint);box-shadow:0 0 18px var(--mint)}
.row .desc{grid-column:1;text-align:right}
.row .work{grid-column:2}
.row.rev .desc{grid-column:2;text-align:left;grid-row:1}
.row.rev .work{grid-column:1;grid-row:1}
.num{font-family:var(--latin);font-weight:800;font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--mint);letter-spacing:-.02em}
.tag{display:block;margin-top:10px;font-size:15px;letter-spacing:.18em;color:var(--muted);font-weight:700}

.check li:before{content:"✓";position:absolute;left:4px;color:var(--mint);font-weight:900}

/* 실습자료 카드 (하늘색 그라디언트) */
.file{display:flex;align-items:center;gap:18px;background:var(--grad2);color:#06202a;border-radius:18px;padding:20px 22px;margin:0 0 16px;box-shadow:0 14px 34px #22d3c530}
.file .fi{flex:1;min-width:0}

.dl{flex:0 0 auto;background:#06202a;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:18px;white-space:nowrap}
.dl:hover{background:#000}.dl:disabled{opacity:.5}
/* 프롬프트 상자 */
.prompt{background:var(--code);border-radius:18px;margin:0 0 18px;position:relative;scroll-margin-top:160px;box-shadow:0 18px 40px #0008,0 0 26px #9b7bff38}
.prompt:before{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:linear-gradient(120deg,#b49bff,#6f8dff 50%,#3ee6c1);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

.ph .no{font-family:var(--latin);font-weight:700;font-size:17px;color:var(--violet);margin-right:10px}
.ph .lb{font-size:18px;color:#d9d9e6;font-weight:700}
.ph .nw{font-size:13px;font-weight:700;background:#9b7bff26;color:#c9b8ff;border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.copy{flex:0 0 auto;background:var(--grad);color:#fff;border:0;border-radius:11px;padding:9px 22px;font-weight:900;font-size:18px;box-shadow:0 8px 20px #6d4dff55}
.copy:hover{filter:brightness(1.1)}.copy.done{background:var(--mint);color:#04241d;box-shadow:none}
.prompt pre{margin:0;padding:20px 24px 24px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:'Noto Sans KR',sans-serif;font-size:21px;line-height:1.85;color:#ececf4}
.prompt.follow .no{color:var(--mint)}.prompt.follow:before{background:linear-gradient(120deg,#3ee6c1,#38bdf8)}.prompt.follow{box-shadow:0 18px 40px #0008,0 0 24px #3ee6c130}
.wt{font-size:15px;letter-spacing:.2em;color:var(--muted);font-weight:700;margin:22px 0 10px}
.wt:first-child{margin-top:0}

.hidden{display:none!important}
.empty{display:none;text-align:center;color:var(--muted);padding:60px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:#fff;color:#111;padding:14px 26px;border-radius:14px;transition:.25s;z-index:60;font-size:19px;font-weight:700}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flash{animation:fl 1.6s ease}@keyframes fl{0%,40%{box-shadow:0 0 0 4px var(--violet)}100%{}}

function buildHTML(extra){
  const out=JSON.parse(JSON.stringify(D));const used=usedFiles();Object.keys(out.FILES).forEach(k=>{if(!used[k])delete out.FILES[k]});

  const tag='<script type="application/json" id="appdata">';
  const start=SRC.indexOf(tag);const end=SRC.indexOf('<'+'/script>',start);
  if(start<0||end<0)throw new Error('원본 구조를 찾지 못했습니다.');
  return SRC.slice(0,start)+tag+json+SRC.slice(end)}

  <label class="ml">브랜치 / 파일 경로</label><div style="display:flex;gap:8px"><input class="minput" id="gBranch" value="${esc(g.branch)}"><input class="minput" id="gPath" value="${esc(g.path)}"></div>
  <label class="ml">액세스 토큰 (Fine-grained token · Contents 읽기/쓰기)</label><input class="minput" id="gTok" type="password" value="${esc(ghTok())}" placeholder="github_pat_로 시작">
  <label class="ml" style="font-weight:500"><input type="checkbox" id="gRem" ${(()=>{try{return localStorage.getItem(TK)?'checked':''}catch(x){return''}})()}> 이 브라우저에 토큰 기억하기 (공용 PC에서는 끄세요)</label>
  <p class="mh">토큰은 HTML 파일에 저장되지 않고 이 브라우저에만 보관됩니다.</p>
  <div class="mbtns"><button class="ap" id="gOk">저장${then?' 후 배포':''}</button>${ghTok()?'<button id="gForget" class="danger">토큰 지우기</button>':''}</div>`);
  $('#gOk').onclick=()=>{const n={owner:$('#gOwner').value.trim(),repo:$('#gRepo').value.trim(),branch:$('#gBranch').value.trim()||'main',path:$('#gPath').value.trim().replace(/^\/+/,'')||'index.html'};
    const tok=$('#gTok').value.trim();if(!n.owner||!n.repo||!tok){toast('아이디, 저장소, 토큰을 모두 넣어 주세요.');return}
    D.site.gh=n;try{sessionStorage.setItem(TK,tok);if($('#gRem').checked)localStorage.setItem(TK,tok);else localStorage.removeItem(TK)}catch(x){}
    dirty();closeModal();if(then)deploy()};
  const fg=$('#gForget');if(fg)fg.onclick=()=>{try{localStorage.removeItem(TK);sessionStorage.removeItem(TK)}catch(x){}closeModal();toast('토큰을 지웠습니다.')}}
async function gh(method,url,body){const r=await fetch('https://api.github.com'+url,{method,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+ghTok(),'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(x){}
  if(!r.ok){const e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e}return j}
function b64OfText(s){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const u=String(fr.result);res(u.slice(u.indexOf(',')+1))};fr.onerror=rej;fr.readAsDataURL(new Blob([s],{type:'text/html'}))})}
let deploying=false;
async function deploy(force){const g=ghCfg();if(!g.owner||!g.repo||!ghTok()){ghSetup(true);return}
  if(deploying)return;deploying=true;const btn=$('[data-act=deploy]');const label=btn.textContent;btn.disabled=true;
  const step=m=>{btn.textContent='⏳ '+m;$('#astat').textContent=m};
  try{const R=`/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`;
    step('저장소 확인 중');const ref=await gh('GET',`${R}/git/ref/heads/${encodeURIComponent(g.branch)}`);const head=ref.object.sha;
    const hc=await gh('GET',`${R}/git/commits/${head}`);
    if(!force&&D.site.baseCommit&&head!==D.site.baseCommit&&!(hc.parents||[]).some(p=>p.sha===D.site.baseCommit)){
      deploying=false;btn.disabled=false;btn.textContent=label;$('#astat').textContent='';
      modal(`<h3>사이트가 다른 곳에서 바뀌었습니다</h3><p class="mh">지금 편집 중인 페이지를 연 뒤에 사이트가 다시 배포되었습니다. 그대로 배포하면 그 변경이 덮어써집니다.<br>가장 안전한 방법은 배포된 사이트 주소에서 <b>#admin</b>으로 다시 들어가 편집하는 것입니다.</p><div class="mbtns"><a class="ap" style="padding:6px 12px;border-radius:10px;color:#fff;text-decoration:none" href="${siteURL(g)}#admin" target="_blank" rel="noopener">사이트에서 다시 열기</a><button id="fz" class="danger">그래도 덮어쓰기</button></div>`);
      $('#fz').onclick=()=>{closeModal();deploy(true)};return}
    const bak=JSON.stringify(D.FILES);const entries=[];const used=usedFiles();const dir=g.path.includes('/')?g.path.replace(/[^/]*$/,''):'';
    try{for(const k of Object.keys(D.FILES)){const f=D.FILES[k];if(!used[k]||!f.data)continue;if(!(isAudio(f)||f.data.length>1400000))continue;
        step('음원·큰 파일 올리는 중');const fb=await gh('POST',`${R}/git/blobs`,{content:f.data,encoding:'base64'});const rel=`files/${k}.${fileExt(f)}`;
        entries.push({path:dir+rel,mode:'100644',type:'blob',sha:fb.sha});f.path=rel;delete f.data}
      step('페이지 만드는 중');var html=buildHTML({baseCommit:head});}
    catch(x){D.FILES=JSON.parse(bak);throw x}
    step('파일 올리는 중');let blob,tree;
    try{blob=await gh('POST',`${R}/git/blobs`,{content:await b64OfText(html),encoding:'base64'});
      tree=await gh('POST',`${R}/git/trees`,{base_tree:hc.tree.sha,tree:[{path:g.path,mode:'100644',type:'blob',sha:blob.sha}].concat(entries)});}
    catch(x){D.FILES=JSON.parse(bak);throw x}
    const d=new Date();const cm=await gh('POST',`${R}/git/commits`,{message:`관리자 모드에서 배포 (${d.toLocaleString('ko-KR')})`,tree:tree.sha,parents:[head]});
    step('반영 중');await gh('PATCH',`${R}/git/refs/heads/${encodeURIComponent(g.branch)}`,{sha:cm.sha,force:false});
    D.site.baseCommit=head;changed=false;try{localStorage.removeItem(KEY)}catch(x){}
    $('#astat').textContent='배포 완료 · 1~2분 뒤 사이트에 반영됩니다 (최대 10분)';
    modal(`<h3>🚀 배포 완료</h3><p class="mh">GitHub에 올렸습니다. 사이트에는 보통 1~2분 뒤에 반영되고, 브라우저에 예전 화면이 남아 있으면 새로고침(Ctrl+F5)하세요.</p><div class="mbtns"><a class="ap" style="padding:6px 12px;border-radius:10px;color:#fff;text-decoration:none" href="${siteURL(g)}" target="_blank" rel="noopener">사이트 열기</a><a style="padding:6px 12px;border-radius:10px;border:1px solid #ffffff22;color:#fff;text-decoration:none" href="https://github.com/${esc(g.owner)}/${esc(g.repo)}/commit/${cm.sha}" target="_blank" rel="noopener">변경 기록 보기</a></div>`);
  }
  catch(x){const s=x.status;$('#astat').textContent='배포 실패';
    const why=s===401?'토큰이 맞지 않거나 만료되었습니다. 「🔑 배포 설정」에서 토큰을 다시 넣어 주세요.':s===403?'토큰에 이 저장소의 「Contents 읽기/쓰기」 권한이 없습니다.':s===404?'저장소나 브랜치를 찾을 수 없습니다. 아이디·저장소·브랜치 이름과 토큰의 저장소 선택을 확인해 주세요.':s===409||s===422?'저장소 상태가 맞지 않습니다(빈 저장소이거나 동시에 다른 변경이 있음). 잠시 후 다시 시도해 주세요.':'인터넷 연결 또는 GitHub 응답 문제입니다: '+x.message;
    modal(`<h3>배포하지 못했습니다</h3><p class="mh">${esc(why)}</p><div class="mbtns"><button class="ap" id="rs">배포 설정 열기</button></div>`);$('#rs').onclick=()=>ghSetup(false)}
  finally{deploying=false;btn.disabled=false;btn.textContent=label}}
window.addEventListener('beforeunload',e=>{if(A&&changed){e.preventDefault();e.returnValue=''}});

/* ---------- 클릭 처리 ---------- */
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true}
document.addEventListener('change',e=>{const t=e.target;if(!A)return;const ci=+t.dataset.c,i=+t.dataset.i;
  if(t.dataset.act==='cstage')act(()=>{const c=D.CARDS.splice(ci,1)[0];c.stage=t.value;let at=-1;D.CARDS.forEach((x,k)=>{if(x.stage===t.value)at=k});D.CARDS.splice(at+1,0,c)},c_id(ci));
  if(t.dataset.act==='pnum')act(()=>{D.CARDS[ci].prompts[i].num=t.checked},c_id(ci));
  if(t.dataset.act==='pnew')act(()=>{D.CARDS[ci][t.dataset.l][i].new=t.checked},c_id(ci))});
document.addEventListener('click',async e=>{
  const cp=e.target.closest('.copy');
  if(cp){const v=TEXT[cp.dataset.t];let ok=false;try{await navigator.clipboard.writeText(v);ok=true}catch(x){ok=fb(v)}
    if(ok){cp.textContent='✓ 복사 완료';cp.classList.add('done');toast('복사했습니다. AI 입력창에 붙여 넣으세요.');setTimeout(()=>{cp.textContent='복사';cp.classList.remove('done')},2000)}else toast('복사가 막혔습니다. 글자를 직접 선택해 복사해 주세요.');return}
  const dl=e.target.closest('.dl');
  if(dl){const f=D.FILES[dl.dataset.f];if(!f){toast('파일이 아직 준비되지 않았습니다.');return}
    if(f.data){saveBlob(b64Blob(f.data,f.mime),f.name);toast('다운로드: '+f.name);return}
    if(f.path){dl.disabled=true;try{const r=await fetch(f.path,{cache:'no-store'});if(!r.ok)throw 0;saveBlob(await r.blob(),f.name);toast('다운로드: '+f.name)}catch(x){toast('다운로드하지 못했습니다. 잠시 후 다시 눌러 주세요.')}finally{dl.disabled=false}return}
    toast('파일이 아직 준비되지 않았습니다.');return}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.type==='checkbox')return;
  const a=b.dataset.act,ci=+b.dataset.c,i=+b.dataset.i,L=b.dataset.l;const C=D.CARDS[ci];
  switch(a){
    case 'mclose':closeModal();return;
    case 'export':exportHTML();return;
    case 'deploy':deploy(false);return;
    case 'ghsetup':ghSetup(false);return;
    case 'undo':undo();return;
    case 'preview':PREVIEW=!PREVIEW;b.textContent=PREVIEW?'✏ 편집으로':'👁 미리보기';render();return;
    case 'exit':if(changed&&!confirm('내려받지 않은 변경이 있습니다. 관리자 모드를 끝낼까요? (편집 내용은 이 브라우저에 임시 저장되어 있습니다)'))return;A=false;PREVIEW=false;render();toast('관리자 모드를 종료했습니다.');return;
    case 'files':filesManager();return;
    case 'settings':settings();return;
    case 'banner':{const x=await pickFile('image/*');if(!x)return;act(()=>{D.site.banner=x.url});toast('배너를 바꿨습니다.');return}
    case 'addcard':act(()=>{const st=D.STAGES[D.STAGES.length-1].id;D.CARDS.push({id:newId('c'),stage:st,title:'새 실습 제목',mode:'실습',slides:'',book:'',ai:'Claude',purpose:'실습 목적을 적어 주세요.',prompts:[{num:true,label:'입력할 문장',text:'프롬프트를 입력하세요.'}],check:['확인할 점을 적어 주세요.']})});{const r=$$('.row');r[r.length-1].scrollIntoView({block:'center'})}toast('맨 아래에 새 실습을 추가했습니다. 단계는 상자 위에서 고르세요.');return;
    case 'gadd':act(()=>D.site.guide.push('새 안내 문장'));return;
    case 'gdel':act(()=>D.site.guide.splice(i,1));return;
    case 'cup':case 'cdown':{const id=C.id;const same=D.CARDS.map((c,k)=>k).filter(k=>D.CARDS[k].stage===C.stage);const pos=same.indexOf(ci);const to=same[pos+(a==='cup'?-1:1)];
      if(to===undefined){toast(a==='cup'?'이 단계의 첫 실습입니다. 단계를 바꾸려면 단계 선택을 쓰세요.':'이 단계의 마지막 실습입니다.');return}
      act(()=>{[D.CARDS[ci],D.CARDS[to]]=[D.CARDS[to],D.CARDS[ci]]},id);return}
    case 'cdup':act(()=>{const c=JSON.parse(JSON.stringify(C));c.id=newId('c');c.title+=' (복제)';D.CARDS.splice(ci+1,0,c)},C.id);return;
    case 'cdel':if(!confirm(`「${C.title}」 실습을 삭제할까요? (실행 취소 가능)`))return;act(()=>D.CARDS.splice(ci,1));return;
    case 'cprompt':act(()=>{C.prompts=C.prompts||[];C.prompts.push({num:true,label:'입력할 문장',text:'프롬프트를 입력하세요.'})},C.id);return;
    case 'cfollow':act(()=>{C.follow=C.follow||[];C.follow.push({label:'후속 요청',text:'후속 요청 문장을 입력하세요.'})},C.id);return;
    case 'ccheck':act(()=>{C.check=C.check||[];C.check.push('확인할 점을 적어 주세요.')},C.id);return;
    case 'cnote':act(()=>{if(C.note!=null)delete C.note;else C.note='참고 내용을 적어 주세요.'},C.id);return;
    case 'kdel':act(()=>C.check.splice(i,1),C.id);return;
    case 'cfile':fileList(ci,'card');return;
    case 'caudio':{const x=await pickFile('audio/*');if(!x)return;const k=newId('a');act(()=>{D.FILES[k]={no:'음원',name:x.name,desc:'',tag:'',mime:x.mime&&x.mime.startsWith('audio/')?x.mime:'audio/mpeg',data:x.data};C.files=C.files||[];C.files.unshift(k)},C.id);toast('음원을 넣었습니다. 제목을 눌러 고치고 「🚀 배포」하세요.');return}
    case 'pfile':fileList(ci,'before',i);return;
    case 'pup':case 'pdown':{const arr=C[L];const d=a==='pup'?-1:1;
      if(i+d>=0&&i+d<arr.length){act(()=>move(arr,i,d),C.id);return}
      // 실습 경계를 넘어 이동 (번호 프롬프트 목록만)
      if(L!=='prompts'){toast('후속 요청은 같은 실습 안에서만 옮길 수 있습니다.');return}
      const order=D.CARDS.map((c,k)=>k).sort((x,y)=>D.STAGES.findIndex(s=>s.id===D.CARDS[x].stage)-D.STAGES.findIndex(s=>s.id===D.CARDS[y].stage)||x-y);
      const pos=order.indexOf(ci);const tci=order[pos+d];if(tci===undefined){toast('더 옮길 곳이 없습니다.');return}
      act(()=>{const p=arr.splice(i,1)[0];const T=D.CARDS[tci];T.prompts=T.prompts||[];if(d<0)T.prompts.push(p);else T.prompts.unshift(p)},D.CARDS[tci].id);toast('옆 실습으로 옮겼습니다. 번호가 자동으로 다시 매겨졌습니다.');return}
    case 'padd':act(()=>C[L].splice(i+1,0,L==='follow'?{label:'후속 요청',text:'후속 요청 문장을 입력하세요.'}:{num:true,label:'입력할 문장',text:'프롬프트를 입력하세요.'}),C.id);return;
    case 'pdel':if(!confirm('이 프롬프트를 삭제할까요? (실행 취소 가능)'))return;act(()=>{C[L].splice(i,1)},C.id);return;
    case 'fup':case 'fdown':case 'funlink':{const pi=b.dataset.pi;const arr=b.dataset.w==='card'?C.files:C.prompts[+pi].filesBefore;
      if(a==='funlink')act(()=>{arr.splice(i,1);if(!arr.length){if(b.dataset.w==='card')delete C.files;else delete C.prompts[+pi].filesBefore}},C.id);
      else act(()=>move(arr,i,a==='fup'?-1:1),C.id);return}
    case 'freplace':{const k=b.dataset.k;const x=await pickFile();if(!x)return;act(()=>{const f=D.FILES[k];f.data=x.data;f.mime=x.mime;f.name=x.name},null);if($('#modal').classList.contains('on'))filesManager();toast('파일을 바꿨습니다: '+x.name);return}
    case 'fdl':{const f=D.FILES[b.dataset.k];saveBlob(b64Blob(f.data,f.mime),f.name);return}
    case 'fpurge':{const k=b.dataset.k;if(!confirm('이 자료를 완전히 삭제할까요? 연결된 실습에서도 빠집니다.'))return;
      act(()=>{delete D.FILES[k];D.CARDS.forEach(c=>{if(c.files){c.files=c.files.filter(x=>x!==k);if(!c.files.length)delete c.files}(c.prompts||[]).forEach(p=>{if(p.filesBefore){p.filesBefore=p.filesBefore.filter(x=>x!==k);if(!p.filesBefore.length)delete p.filesBefore}})})});filesManager();return}
  }
});
render();setTimeout(go,60);
})();
</script>
